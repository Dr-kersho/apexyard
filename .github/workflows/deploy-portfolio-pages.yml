name: Deploy Ahmed portfolio to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, claude/LOCAL-64-polish-ahmed-portfolio]
    paths:
      - projects/ahmedportfolio/**
      - .github/workflows/deploy-portfolio-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (portfolio.html as index)
        run: |
          mkdir -p _site
          cp projects/ahmedportfolio/portfolio.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
